id: 0f449c58-6be3-4b5f-a3f4-5c106f6fd37c
name: "@puddleworks/obsidian-task-scan"
description: "Find the open tasks in an Obsidian vault that a swamp extension could do, using Jev to classify them."
version: 1
tags:
  puddle: "true"
  maxReruns: "5"
  maxWallClock: "30m"

inputs:
  type: object
  properties:
    folder:
      type: string
      description: "Subfolder of the vault to scan, relative to the vault root. Empty scans the whole vault."
      default: ""
  required: []

jobs:
  - name: main
    description: "List the vault's open tasks, ask Jev about each, and classify them."
    dependsOn: []
    weight: 0
    steps:
      - name: run
        description: "The open tasks, leaving out templates and daily notes, and one question for Jev about each."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-task-scan-model
          methodName: run
          inputs:
            folder: ${{ inputs.folder }}
      - name: ask
        description: "Ask Jev whether a swamp extension could do each task. A failure here leaves the tasks unclassified."
        dependsOn:
          - step: run
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: ${{ size(steps.run.outputs.questions) == 0 }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: ask
          inputs:
            name: obsidian-task-scan
            state: "Classify each task."
            questions: ${{ steps.run.outputs.questions }}
      - name: classify
        description: "Every task with its classification (candidate, not_candidate, unclassified or withheld) and confidence."
        dependsOn:
          - step: run
            condition:
              type: succeeded
          - step: ask
            condition:
              type: always
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-task-scan-model
          methodName: classify
          inputs:
            tasks: ${{ steps.run.outputs.items }}
            answers: '${{ has(steps.ask) && steps.ask.status == "succeeded" ? steps.ask.outputs.answers : {} }}'
