id: 0f449c58-6be3-4b5f-a3f4-5c106f6fd37c
name: "@puddleworks/obsidian-task-scan"
description: "Find the open tasks in an Obsidian vault that a swamp extension could do, using Jev to classify them."
version: 1
tags:
  puddle: "true"
  maxReruns: "5"
  maxWallClock: "30m"

inputs:
  type: object
  properties:
    folder:
      type: string
      description: "Subfolder of the vault to scan, relative to the vault root. Empty scans the whole vault."
      default: ""
  required: []

jobs:
  - name: scan
    description: "List the vault's open tasks, leaving out templates and daily notes, with the questions for Jev in batches."
    dependsOn: []
    weight: 0
    steps:
      - name: run
        description: "The open tasks and the questions for Jev about them."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-task-scan-model
          methodName: run
          inputs:
            folder: ${{ inputs.folder }}
  - name: ask
    description: "Ask Jev whether a swamp extension could do each task, one request per batch. A failed request leaves its tasks unclassified."
    dependsOn:
      - job: scan
        condition:
          type: succeeded
    weight: 0
    steps:
      - name: ask-${{ self._index }}
        description: "Ask Jev about one batch of tasks."
        forEach:
          item: batch
          in: ${{ data.latest("obsidian-task-scan-model", "result").attributes.batches }}
        concurrency: 1
        dependsOn: []
        weight: 0
        allowFailure: true
        task:
          type: model_method
          modelIdOrName: jev
          methodName: ask
          inputs:
            name: obsidian-task-scan-${{ self._index }}
            state: ${{ steps.run.outputs.guidance }}
            questions: ${{ self.batch }}
  - name: classify
    description: "Classify every task from the answers Jev gave."
    dependsOn:
      - job: scan
        condition:
          type: succeeded
      - job: ask
        condition:
          type: always
    weight: 0
    steps:
      - name: classify
        description: "Every task with its classification (candidate, not_candidate, unclassified or withheld) and confidence."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-task-scan-model
          methodName: classify
          inputs:
            tasks: ${{ steps.run.outputs.items }}
            answers: '${{ steps.filter(k, k.startsWith("ask-") && steps[k].status == "succeeded").map(k, steps[k].outputs.answers) }}'
