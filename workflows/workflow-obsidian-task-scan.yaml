id: 0f449c58-6be3-4b5f-a3f4-5c106f6fd37c
name: "@puddleworks/obsidian-task-scan"
description: "List the open task lines (\"- [ ]\") in an Obsidian vault, with the file each came from, as candidates for puddle requests."
version: 1
tags:
  puddle: "true"

inputs:
  type: object
  properties:
    folder:
      type: string
      description: "Subfolder of the vault to scan, relative to the vault root. Empty scans the whole vault."
      default: ""
  required: []

jobs:
  - name: main
    description: "Run obsidian-task-scan once with the user's inputs."
    dependsOn: []
    weight: 0
    steps:
      - name: run
        description: "A list of open tasks, each with the task text, the vault-relative file path and the line number."
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: obsidian-task-scan-model
          methodName: run
          inputs:
            folder: ${{ inputs.folder }}
